<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Liga JR · actualizar FIX34</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020806;color:#f4f7f5;font-family:system-ui}.box{width:min(92vw,590px);padding:30px;border:1px solid #1e7050;border-radius:24px;background:#06110d;text-align:center}.spin{width:54px;height:54px;margin:auto;border:4px solid #173027;border-top-color:#20e8a1;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#a9bcb0}small{display:block;color:#7e9589;margin-top:12px}</style></head>
<body><main class="box"><div class="spin"></div><h1>Aplicando FIX34</h1><p>Quitando el logo genérico de Liga Juventino Rosas en los botones de categoría y dejando Primera Fuerza con su propio logo.</p><small id="s">Limpiando caché y PWA…</small></main>
<script>(async()=>{const BUILD='38-34',s=document.getElementById('s');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}try{sessionStorage.removeItem('jr57-refresh-attempt')}catch(_){}s.textContent='Descargando archivos FIX34…';const urls=['./assets/jr-v38-mobile-sync.js?v='+BUILD,'./assets/jr-v38-fix34-category-cleanup.js?v='+BUILD,'./assets/jr-v38-fix34-category-cleanup.css?v='+BUILD,'./assets/branding/primera-fuerza-hd.png?build='+BUILD,'./build-v38.json?t='+Date.now(),'./manifest.webmanifest?t='+Date.now()];await Promise.all(urls.map(u=>fetch(u,{cache:'reload',credentials:'omit'}).catch(()=>null)))}catch(e){}s.textContent='Abriendo Liga JR build '+BUILD+'…';const u=new URL('./',location.href);u.searchParams.set('refresh',BUILD);u.searchParams.set('nocache',Date.now());u.hash='admin';setTimeout(()=>location.replace(u.href),800)})();</script></body></html>
