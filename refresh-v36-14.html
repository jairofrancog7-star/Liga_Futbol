<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Liga JR · V36.14</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100b;color:#fff;font-family:system-ui}
main{text-align:center;padding:28px}.ball{font-size:62px;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(960deg)}}p{color:#9fb4a8;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="ball">⚽</div>
  <h1>V36.14 · BALÓN COMPLETO</h1>
  <p>Ajustando cámara para mostrar los dos balones completos dentro de sus cuadros.</p>
</main>
<script>
(async()=>{
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>{})));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>location.replace("./?v=36-14-"+Date.now()),900);
})();
</script>
</body>
</html>
