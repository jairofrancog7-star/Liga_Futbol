<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Actualizando temporada actual</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;color:#f2f2f5;font-family:system-ui,sans-serif}
main{max-width:600px;padding:30px;text-align:center}.loader{width:54px;height:54px;margin:0 auto 18px;border:4px solid #24242a;border-top-color:#22e07a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#777785}
</style>
</head>
<body><main><div class="loader"></div><h1>Actualizando Liga Juventino Rosas</h1><p>Cargando equipos vigentes, jornadas y fase actual por categoría...</p><small>MASTER V19</small></main>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){}
 setTimeout(()=>location.replace('./?v=19-'+Date.now()),800);
})();
</script></body></html>
