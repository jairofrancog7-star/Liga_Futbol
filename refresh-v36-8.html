<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Liga JR · V36.8</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100b;color:#fff;font-family:system-ui}
main{text-align:center;padding:28px}.b{font-size:64px;animation:r 1.1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#9fb4a8}
</style>
</head>
<body>
<main><div class="b">⚽</div><h1>V36.8</h1><p>Ajustando el balón al cuadro completo.</p></main>
<script>
(async()=>{
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.update().catch(()=>{})));
    }
  }catch(e){}
  setTimeout(()=>location.replace("./?v=36-8-"+Date.now()),800);
})();
</script>
</body>
</html>
