<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Actualizando Liga JR · FIX38</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030815;color:#f6f9ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(92vw,620px);padding:32px;border:1px solid rgba(92,126,255,.28);border-radius:26px;background:linear-gradient(145deg,#07143a,#04110d);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.45)}.spin{width:58px;height:58px;margin:0 auto 18px;border:4px solid #172341;border-top-color:#46efb8;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 10px}p{color:#9aabd0;line-height:1.5}.ok{color:#58f0bb;font-weight:900;margin-top:14px}</style></head><body><main class="box"><div class="spin"></div><h1>Aplicando FIX38</h1><p>Logo exacto de América Veteranos 35+, botones compactos y caché PWA renovada.</p><div class="ok" id="s">Limpiando caché…</div></main><script>(async()=>{const s=document.getElementById('s');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}sessionStorage.removeItem('jr57-refresh-attempt')}catch(e){}s.textContent='Abriendo versión 38-38…';const x=new URL('./',location.href);x.searchParams.set('refresh','38-38');x.searchParams.set('n',Date.now());x.hash='teams';setTimeout(()=>location.replace(x.href),650)})();</script></body></html>
