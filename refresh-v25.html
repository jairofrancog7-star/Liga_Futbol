<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Activando MASTER V25</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080a;color:#fff;font:16px system-ui}main{padding:28px;text-align:center;max-width:620px}.r{width:54px;height:54px;border:4px solid #25272d;border-top-color:#20e883;border-radius:50%;margin:auto;animation:r .75s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#9ba0ab}
</style></head><body><main><div class="r"></div><h1>MASTER V25</h1><p>Limpiando caché y cargando la nueva capa de Liga Juventino Rosas.</p></main><script>
(async()=>{try{if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if("caches"in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}setTimeout(()=>location.replace("./?v=25-"+Date.now()),900)})();
</script></body></html>
