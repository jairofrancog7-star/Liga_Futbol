<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Recuperar Liga · V31</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090d;color:#fff;font-family:system-ui}
main{text-align:center;max-width:620px;padding:28px}.r{width:56px;height:56px;margin:auto;border:4px solid #242832;border-top-color:#18e07b;border-radius:50%;animation:x .7s linear infinite}@keyframes x{to{transform:rotate(360deg)}}p{color:#9aa3af}
</style>
</head>
<body><main><div class="r"></div><h1>Recuperando Liga Juventino Rosas</h1><p>Eliminando cachés antiguas y Service Workers para cargar la versión estable.</p></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){try{await r.update()}catch(e){} try{await r.unregister()}catch(e){}}
    }
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
    await fetch('./index.html?jr31='+Date.now(),{cache:'reload'});
  }catch(e){}
  setTimeout(()=>location.replace('./?v=31-'+Date.now()),900);
})();
</script></body></html>
