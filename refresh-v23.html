<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Activando MASTER V23</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050608;color:#f2f2f5;font:16px system-ui}main{max-width:620px;text-align:center;padding:32px}.r{width:54px;height:54px;margin:auto;border:4px solid #24262b;border-top-color:#22e07a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#8a8d98}</style></head><body><main><div class="r"></div><h1>MASTER V23</h1><p>Limpiando caché y activando JR Football OS, tácticas, cancha animada y simulador.</p></main>
<script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.replace('./?v=23-'+Date.now()),900)})();</script></body></html>
