<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Liga JR · Refresh V36.24</title>
<style>
html,body{margin:0;min-height:100%;background:#06100b;color:#fff;font-family:system-ui}
body{min-height:100vh;display:grid;place-items:center}
main{text-align:center;padding:28px;max-width:620px}
.ball{font-size:64px;animation:r .82s linear infinite}
@keyframes r{to{transform:rotate(960deg)}}
h1{margin:12px 0 8px}
p{color:#a7baaf;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="ball">⚽</div>
  <h1>V36.24 · BALÓN GRANDE + ÓRBITAS COMPLETAS</h1>
  <p>Limpiando caché. Esta versión carga el balón verde grande como el amarillo y corrige las órbitas de fondo que seguían recortándose.</p>
</main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>{})));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.setItem('jrLastRefresh','36.24')}catch(e){}
    try{sessionStorage.setItem('jrLastRefresh','36.24')}catch(e){}
  }catch(e){}
  setTimeout(()=>location.replace('./?v=36-24-'+Date.now()),1000);
})();
</script>
</body>
</html>
