<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizando MASTER V20</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;color:#fff;font-family:system-ui}.box{text-align:center;padding:28px}.ball{font-size:52px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#8a8a96}</style></head><body><div class="box"><div class="ball">⚽</div><h1>Actualizando la Liga</h1><p>Limpiando equipos y calendarios anteriores…</p><small>MASTER V20</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}setTimeout(()=>location.replace('./?v=20-'+Date.now()),800)})();</script></body></html>
