<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Liga JR · V36.8.1</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100b;color:#fff;font-family:system-ui}
main{text-align:center;padding:28px}.b{font-size:64px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#9fb4a8}
</style>
</head>
<body>
<main>
  <div class="b">⚽</div>
  <h1>V36.8.1</h1>
  <p>Forzando la versión más reciente del balón y estilos.</p>
</main>
<script>
(async()=>{
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(async r=>{
        try{await r.update()}catch(e){}
      }));
    }
  }catch(e){}
  setTimeout(()=>location.replace("./?v=36-8-1-"+Date.now()),850);
})();
</script>
</body>
</html>
