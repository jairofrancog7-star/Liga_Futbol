<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>MASTER V30.4</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080a;color:#fff;font:16px system-ui}main{text-align:center;padding:28px;max-width:640px}.r{width:54px;height:54px;margin:auto;border:4px solid #25272d;border-top-color:#22e07a;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#959aa6}</style></head><body><main><div class="r"></div><h1>MASTER V30.4</h1><p>Limpiando cache y activando la version estable sin la capa V28.</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.replace('./?v=30.4-'+Date.now()),900)})();</script></body></html>
