<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>MASTER V26</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07080a;color:white;font:16px system-ui}main{text-align:center;padding:24px}.r{width:52px;height:52px;border-radius:50%;border:4px solid #222;border-top-color:#20e883;margin:auto;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#9ba0ab}
</style></head><body><main><div class="r"></div><h1>MASTER V26</h1><p>Actualizando botones y limpiando caché.</p></main><script>
(async()=>{try{if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if("caches"in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}setTimeout(()=>location.replace("./?v=26-"+Date.now()),850)})();
</script></body></html>
