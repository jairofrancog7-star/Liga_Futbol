name: Apply V38 FIX56 direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fix56.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear credenciales desde la foto aportada
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from PIL import Image

          url='https://d2ol7oe51mr4n9.cloudfront.net/user_3JFWXON60GMBOz1CiR5CypSau9I/059fb4c3-1ded-40be-9743-5f05183c205f.jpg'
          src=Path('/tmp/credenciales-liga.jpg')
          urlretrieve(url,src)
          im=Image.open(src).convert('RGB')
          out=Path('assets/credential-references'); out.mkdir(parents=True,exist_ok=True)
          crops={
            'segunda-tapatio-rafael-torres.webp':(0,0,545,375),
            'primera-cuenda-abel-linares-cuevas.webp':(535,0,1090,375),
            'intermedia-malvinas-santiago-godinez.webp':(20,370,545,700),
            'veteranos35-pozos-fernando-palma-morales.webp':(535,370,1060,700),
            'intermedia-la-huerta-juan-hortelano.webp':(45,690,545,995),
            'veteranos35-psv-martin-guerrero-garcia.webp':(530,690,1035,995),
            'veteranos-pozos-julio-cesar-pardini.webp':(1010,705,1536,1004),
          }
          for name,box in crops.items():
              im.crop(box).save(out/name,'WEBP',quality=90,method=6)
          PY

      - name: Activar FIX56 y romper cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(?s)\s*<!-- JR_V38_FIX56_DIRECT -->.*?jr-v38-fix56\.js\?v=[^"\'\s<]+"></script>\s*','\n',s)
          block='''\n<!-- JR_V38_FIX56_DIRECT -->\n<link rel="stylesheet" href="./assets/jr-v38-fix56.css?v=38-56-r1">\n<script defer src="./assets/jr-v38-fix56.js?v=38-56-r1"></script>\n'''
          s=s.replace('</body>',block+'\n</body>')
          s=re.sub(r'jr-v38-mobile-sync\.js\?v=[^"\'\s<]+','jr-v38-mobile-sync.js?v=38-56',s)
          s=re.sub(r'jr-v38-fix55\.css\?v=[^"\'\s<]+','jr-v38-fix55.css?v=38-56-r1',s)
          s=re.sub(r'jr-v38-fix55\.js\?v=[^"\'\s<]+','jr-v38-fix55.js?v=38-56-r1',s)
          p.write_text(s,encoding='utf-8',newline='\n')
          build={
            'build':'38-56','webVersion':'38.56','androidVersionName':'1.4.0','androidVersionCode':9,
            'generated':'2026-09-15','cachePolicy':'network-first-no-service-worker-cache',
            'officialData':'data/official-live.json',
            'fix56':'credentials-team-logos-category-logos-match-cedulas-bottom-nav'
          }
          Path('build-v38.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html build-v38.json assets/credential-references/
          if git diff --cached --quiet; then
            echo 'FIX56 ya estaba aplicado.'
          else
            git commit -m 'fix: activate V38 FIX56 and restore credential images'
            git pull --rebase origin main
            git push origin main
          fi
