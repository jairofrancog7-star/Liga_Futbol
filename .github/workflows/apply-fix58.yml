name: Restore previous cards UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fix58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liga-jr-restore-legacy-cards
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar tarjetas anteriores y quitar overrides FIX58/FIX60
        shell: python
        run: |
          from pathlib import Path
          import re, json

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          # Quitar inyecciones directas de FIX58/FIX60 sin tocar el resto del proyecto.
          s = re.sub(r'\n?<!-- JR_V38_FIX58_DIRECT -->.*?(?=\n<!-- JR_V38_FIX|\n</body>)', '', s, flags=re.S)
          s = re.sub(r'\n?<!-- JR_V38_FIX60_DIRECT -->.*?(?=\n<!-- JR_V38_FIX|\n</body>)', '', s, flags=re.S)
          s = re.sub(r'\n?<link[^>]+jr-v38-fix58\.css[^>]*>', '', s)
          s = re.sub(r'\n?<script[^>]+jr-v38-fix58\.js[^>]*></script>', '', s)
          s = re.sub(r'\n?<link[^>]+jr-v38-fix60\.css[^>]*>', '', s)
          s = re.sub(r'\n?<script[^>]+jr-v38-fix60\.js[^>]*></script>', '', s)

          # Romper caché del loader que conserva el diseño anterior.
          s = re.sub(r'(jr-v38-fix54\.js\?v=)[^"\']+', r'\g<1>38-61-restore', s)
          index.write_text(s, encoding='utf-8', newline='\n')

          # FIX54 queda solo con sus funciones previas: categorías + cédulas internas.
          legacy = r'''/* V38 FIX54 restored — category cards remain functional and all cedulas stay inside Liga Juventino Rosas */
          (()=>{'use strict';
          const host=document.getElementById('jr53TopCategoryHost');
          host?.addEventListener('click',e=>{
           const b=e.target.closest('button[data-category]');if(!b)return;
           const chip=Array.from(document.querySelectorAll('#categoryBar [data-category]')).find(x=>x.dataset.category===b.dataset.category);
           if(chip)chip.click();
           host.querySelectorAll('button').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});
          });
          window.addEventListener('click',e=>{
           const a=e.target.closest?.('a[href*="cedula-arbitral/"]');if(!a)return;
           e.preventDefault();e.stopImmediatePropagation();
           const id=(a.getAttribute('href')||'').match(/cedula-arbitral\\/(\\d+)/)?.[1]||'';
           location.href='./cedulas.html'+(id?'?cedula='+encodeURIComponent(id):'');
          },true);
          const actions=document.querySelector('.top-actions');
          if(actions&&!document.getElementById('jr54Cedulas')){const a=document.createElement('a');a.id='jr54Cedulas';a.href='./cedulas.html';a.className='ghost-btn';a.textContent='Cédulas';actions.append(a)}
          })();
          '''
          Path('assets/jr-v38-fix54.js').write_text(legacy, encoding='utf-8', newline='\n')

          # Marcar restauración para evitar confusión de versiones.
          p = Path('build-v38.json')
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  data = {}
              data['build'] = '38-61-restore'
              data['webVersion'] = '38.61-restore'
              data['restore'] = 'previous-match-and-table-cards'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

      - name: Publicar restauración
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/jr-v38-fix54.js build-v38.json
          if git diff --cached --quiet; then
            echo 'La restauración ya estaba aplicada.'
            exit 0
          fi
          git commit -m 'restore: previous match and table cards, remove FIX58/FIX60 overrides'
          git pull --rebase origin main
          git push origin HEAD:main
