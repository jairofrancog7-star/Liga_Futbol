name: Apply V38 FIX58 direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fix58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liga-jr-fix58
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar logos oficiales aportados por el usuario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/categories
          curl -fL --retry 3 --retry-delay 2 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JFWXON60GMBOz1CiR5CypSau9I/1c7da512-5529-4da3-afb6-008c20f599ec.png' \
            -o assets/categories/segunda-fuerza-user.png
          curl -fL --retry 3 --retry-delay 2 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JFWXON60GMBOz1CiR5CypSau9I/be5a48b7-b293-4e6e-a0ae-e965dbf7d2bc.png' \
            -o assets/categories/veteranos-35-user.png
          test -s assets/categories/segunda-fuerza-user.png
          test -s assets/categories/veteranos-35-user.png

      - name: Activar FIX58 y romper cache
        shell: python
        run: |
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<!-- JR_V38_FIX58_DIRECT -->.*?(?=\n<!-- JR_V38_FIX|\n</body>)','',s,flags=re.S)
          s=re.sub(r'\n?<link[^>]+jr-v38-fix58\.css[^>]*>','',s)
          s=re.sub(r'\n?<script[^>]+jr-v38-fix58\.js[^>]*></script>','',s)
          block='''\n<!-- JR_V38_FIX58_DIRECT -->\n<link rel="stylesheet" href="./assets/jr-v38-fix58.css?v=38-58-r1">\n<script defer src="./assets/jr-v38-fix58.js?v=38-58-r1"></script>\n'''
          s=s.replace('</body>',block+'\n</body>')
          p.write_text(s,encoding='utf-8',newline='\n')

          build={
            'build':'38-58','webVersion':'38.58','androidVersionName':'1.4.0','androidVersionCode':9,
            'generated':'2026-09-15','cachePolicy':'network-first-no-service-worker-cache',
            'officialData':'data/official-live.json',
            'fix58':'official-category-logos-all-crosses-category-round-filters-internal-cedulas'
          }
          Path('build-v38.json').write_text(json.dumps(build,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Validar JavaScript FIX58
        run: node --check assets/jr-v38-fix58.js

      - name: Publicar FIX58
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html build-v38.json assets/categories/segunda-fuerza-user.png assets/categories/veteranos-35-user.png
          if git diff --cached --quiet; then
            echo 'FIX58 ya estaba aplicado.'
            exit 0
          fi
          git commit -m 'fix: activate V38 FIX58 official logos and match crosses'
          git pull --rebase origin main
          git push origin HEAD:main
