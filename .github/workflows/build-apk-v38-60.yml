name: Build APK Liga JR V38.60

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'assets/jr-v38-fix60.js'
      - 'assets/jr-v38-fix60.css'
      - '.github/workflows/build-apk-v38-60.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-liga-jr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-wrapper :app:assembleDebug --no-daemon

      - name: Publish APK file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk downloads/Liga_Juventino_Rosas.apk
          sha256sum downloads/Liga_Juventino_Rosas.apk | awk '{print $1}' > downloads/Liga_Juventino_Rosas.apk.sha256
          cat > downloads/README_APK.txt <<'TXT'
          Liga Juventino Rosas Android
          Version 1.5.1 · Web build 38-60
          APK: Liga_Juventino_Rosas.apk
          Este APK abre la versión oficial de GitHub Pages y limpia la caché al detectar un nuevo WEB_BUILD.
          TXT

      - name: Commit APK when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Liga JR APK Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/Liga_Juventino_Rosas.apk downloads/Liga_Juventino_Rosas.apk.sha256 downloads/README_APK.txt
          if git diff --cached --quiet; then
            echo 'APK sin cambios.'
            exit 0
          fi
          git commit -m 'build: publish Android APK 1.5.1 V38.60'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: Liga_Juventino_Rosas-1.5.1
          path: downloads/Liga_Juventino_Rosas.apk
