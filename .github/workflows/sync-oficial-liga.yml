name: Sync datos oficiales Liga JR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Escanear todas las cédulas públicas y logos"
        required: false
        default: "true"
      send_social:
        description: "Enviar resúmenes por Meta si existen secrets privados"
        required: false
        default: "false"
  schedule:
    - cron: "7,37 * * * *"
    - cron: "23 18 * * 0"
    - cron: "0 18 * * 5"

permissions:
  contents: write

concurrency:
  group: liga-jr-official-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --quiet beautifulsoup4 requests pillow cairosvg

      - name: Elegir modo
        id: mode
        shell: bash
        run: |
          FULL=false
          SEND=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full }}" == "true" ]]; then FULL=true; fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "23 18 * * 0" ]]; then FULL=true; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.send_social }}" == "true" ]]; then SEND=true; fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 18 * * 5" ]]; then SEND=true; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "send=$SEND" >> "$GITHUB_OUTPUT"

      - name: Sincronización rápida
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        run: python scripts/sync_adminfut_public.py --root . --fast

      - name: Sincronización completa
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/sync_adminfut_public.py --root .

      - name: Auditoría amplia de cédulas públicas
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: python scripts/audit_all_cedulas_v35.py --root . --max-id 650 --workers 8

      - name: Normalizar variantes públicas documentadas
        run: python scripts/normalize_public_rosters_v35.py

      - name: Instalar logo exacto América Veteranos 35+
        run: python scripts/sync_america_logo_v37.py

      - name: Activar FIX43 directo en GitHub Pages
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'jr-v38-mobile-sync\.js\?v=[^"\']+', 'jr-v38-mobile-sync.js?v=38-43', s)
          s=re.sub(r'jr-v38-fix43-category-row\.css\?v=[^"\']+', 'jr-v38-fix43-category-row.css?v=38-43-r2', s)
          s=re.sub(r'jr-v38-fix43-category-row\.js\?v=[^"\']+', 'jr-v38-fix43-category-row.js?v=38-43-r2', s)
          marker='<!-- JR_V38_FIX43_DIRECT -->'
          if marker not in s:
              direct='''\n<!-- JR_V38_FIX43_DIRECT -->\n<link rel="stylesheet" href="./assets/jr-v38-fix43-category-row.css?v=38-43-r2">\n<script defer src="./assets/jr-v38-fix43-category-row.js?v=38-43-r2"></script>\n'''
              s=s.replace('</body>',direct+'\n</body>')
          p.write_text(s,encoding="utf-8",newline="\n")
          print('FIX43 R2 loader activo en index.html')

      - name: Generar tablas, resultados y jornadas premium
        run: python scripts/generate_social_cards_v36.py

      - name: Validar snapshot
        shell: python
        run: |
          import json
          d=json.load(open("data/official-live.json",encoding="utf-8"))
          p=d["categories"]["3"]
          counts=p.get("counts") or p.get("dashboard",{}).get("counts",{})
          assert int(counts["Jugadores"]) >= 1
          assert "fixtures" in p
          assert int(p.get("public_player_count_scraped") or 0) >= 1
          v50=d["categories"]["1"]
          v50c=v50.get("counts") or v50.get("dashboard",{}).get("counts",{})
          assert int(v50.get("public_player_count_scraped") or 0) == int(v50c.get("Jugadores") or 0)
          print("Primera:",counts,"nombres públicos:",p.get("public_player_count_scraped"))
          print("Veteranos 50:",v50.get("public_player_count_scraped"),"/",v50c.get("Jugadores"))
          print("Auditoría:",d.get("cedula_audit",{}))

      - name: Guardar datos, FIX43 y publicaciones sólo si cambiaron
        shell: bash
        run: |
          git config user.name "Liga JR Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/official-live.json assets/official-logos/ assets/branding/america-veteranos-35-user.png publicaciones/latest/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios públicos."
            exit 0
          fi
          git commit -m "Data: sync cedulas + keep FIX43 loader"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Envío opcional WhatsApp y Facebook
        if: steps.mode.outputs.send == 'true'
        shell: bash
        env:
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          set +e
          GRAPH="${META_GRAPH_VERSION:-v23.0}"
          send_wa(){
            FILE="$1"; CAP="$2"
            [[ ! -f "$FILE" ]] && { echo "WhatsApp: archivo no existe $FILE"; return; }
            RESP=$(curl -sS -X POST "https://graph.facebook.com/$GRAPH/$WHATSAPP_PHONE_NUMBER_ID/media" -H "Authorization: Bearer $WHATSAPP_TOKEN" -F "messaging_product=whatsapp" -F "file=@$FILE")
            MID=$(python -c "import json,sys;print(json.loads(sys.argv[1]).get('id',''))" "$RESP" 2>/dev/null)
            [[ -z "$MID" ]] && { echo "WhatsApp: no se pudo subir $FILE"; return; }
            curl -sS -X POST "https://graph.facebook.com/$GRAPH/$WHATSAPP_PHONE_NUMBER_ID/messages" -H "Authorization: Bearer $WHATSAPP_TOKEN" -H "Content-Type: application/json" -d "{\"messaging_product\":\"whatsapp\",\"to\":\"$WHATSAPP_TO\",\"type\":\"image\",\"image\":{\"id\":\"$MID\",\"caption\":\"$CAP\"}}" >/dev/null
            echo "WhatsApp: enviado $FILE"
          }
          if [[ -n "$WHATSAPP_TOKEN" && -n "$WHATSAPP_PHONE_NUMBER_ID" && -n "$WHATSAPP_TO" ]]; then
            send_wa publicaciones/latest/resumen-jornada.png "Liga Juventino Rosas · próxima jornada"
            send_wa publicaciones/latest/resumen-tablas.png "Liga Juventino Rosas · tablas actualizadas"
            send_wa publicaciones/latest/resumen-resultados.png "Liga Juventino Rosas · resultados"
          else
            echo "WhatsApp automático pendiente: faltan secrets privados."
          fi
          if [[ -n "$FACEBOOK_PAGE_ID" && -n "$FACEBOOK_PAGE_TOKEN" ]]; then
            for ITEM in "resumen-jornada.png|Liga Juventino Rosas · próxima jornada" "resumen-tablas.png|Liga Juventino Rosas · tablas actualizadas" "resumen-resultados.png|Liga Juventino Rosas · resultados"; do
              FILE="${ITEM%%|*}"; CAP="${ITEM#*|}"
              [[ -f "publicaciones/latest/$FILE" ]] && curl -sS -X POST "https://graph.facebook.com/$GRAPH/$FACEBOOK_PAGE_ID/photos" -F "source=@publicaciones/latest/$FILE" -F "caption=$CAP" -F "access_token=$FACEBOOK_PAGE_TOKEN" >/dev/null
            done
            echo "Facebook: publicaciones enviadas."
          else
            echo "Facebook automático pendiente: faltan secrets privados."
          fi
