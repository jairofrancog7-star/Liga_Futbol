name: Sync datos oficiales Liga JR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Escanear cédulas y descargar logos"
        required: false
        default: "false"
  schedule:
    - cron: "7,37 * * * *"
    - cron: "23 18 * * 0"

permissions:
  contents: write

concurrency:
  group: liga-jr-official-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --quiet beautifulsoup4 requests

      - name: Elegir modo
        id: mode
        shell: bash
        run: |
          FULL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full }}" == "true" ]]; then FULL=true; fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "23 18 * * 0" ]]; then FULL=true; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      - name: Sincronización rápida
        if: steps.mode.outputs.full != 'true'
        run: python scripts/sync_adminfut_public.py --root . --fast

      - name: Sincronización completa
        if: steps.mode.outputs.full == 'true'
        run: python scripts/sync_adminfut_public.py --root .

      - name: Validar snapshot
        shell: python
        run: |
          import json
          d=json.load(open("data/official-live.json",encoding="utf-8"))
          p=d["categories"]["3"]
          counts=p.get("counts") or p.get("dashboard",{}).get("counts",{})
          assert int(counts["Jugadores"]) >= 1
          assert "fixtures" in p
          print("Primera:",counts)

      - name: Guardar sólo si cambió
        shell: bash
        run: |
          git config user.name "Liga JR Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official-live.json assets/official-logos/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios públicos."
            exit 0
          fi
          git commit -m "Data: sync public league snapshot"
          git push origin HEAD:main
