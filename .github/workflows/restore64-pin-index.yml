name: Restore68 pin regenerated views

on:
  push:
    paths:
      - '.github/workflows/restore64-pin-index.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin restore68 directly in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          V='38-68-r1'
          s=re.sub(r'\./assets/jr-v38-fix54\.js\?v=[^"\']+','./assets/jr-v38-fix54.js?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore64-exact\.css\?v=[^"\']+','./assets/jr-v38-restore64-exact.css?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore64-exact\.js\?v=[^"\']+','./assets/jr-v38-restore64-exact.js?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore65-partidos\.css\?v=[^"\']+','./assets/jr-v38-restore65-partidos.css?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore65-partidos\.js\?v=[^"\']+','./assets/jr-v38-restore65-partidos.js?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore66-polish\.css\?v=[^"\']+','./assets/jr-v38-restore66-polish.css?v='+V,s)
          s=re.sub(r'\./assets/jr-v38-restore66-polish\.js\?v=[^"\']+','./assets/jr-v38-restore66-polish.js?v='+V,s)
          css67='<link rel="stylesheet" href="./assets/jr-v38-restore67-regenerate.css?v='+V+'" data-jr67-direct="1">'
          js67='<script defer src="./assets/jr-v38-restore67-regenerate.js?v='+V+'" data-jr67-direct="1"></script>'
          css68='<link rel="stylesheet" href="./assets/jr-v38-restore68-table-motion.css?v='+V+'" data-jr68-direct="1">'
          js68='<script defer src="./assets/jr-v38-restore68-table-motion.js?v='+V+'" data-jr68-direct="1"></script>'
          if 'jr-v38-restore67-regenerate.css' not in s:s=s.replace('</head>',css67+'\n</head>',1)
          else:s=re.sub(r'<link[^>]+jr-v38-restore67-regenerate\.css\?v=[^"\']+[^>]*>',css67,s)
          if 'jr-v38-restore68-table-motion.css' not in s:s=s.replace('</head>',css68+'\n</head>',1)
          else:s=re.sub(r'<link[^>]+jr-v38-restore68-table-motion\.css\?v=[^"\']+[^>]*>',css68,s)
          if 'jr-v38-restore67-regenerate.js' not in s:s=s.replace('</body>',js67+'\n</body>',1)
          else:s=re.sub(r'<script[^>]+jr-v38-restore67-regenerate\.js\?v=[^"\']+[^>]*></script>',js67,s)
          if 'jr-v38-restore68-table-motion.js' not in s:s.replace('</body>',js68+'\n</body>',1)
          if 'jr-v38-restore68-table-motion.js' not in s:s=s.replace('</body>',js68+'\n</body>',1)
          else:s=re.sub(r'<script[^>]+jr-v38-restore68-table-motion\.js\?v=[^"\']+[^>]*></script>',js68,s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index pin
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already pinned'
            exit 0
          fi
          git config user.name 'Liga JR Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'restore68: pin complete logos form badges and hero edge motion'
          git push origin HEAD:main
