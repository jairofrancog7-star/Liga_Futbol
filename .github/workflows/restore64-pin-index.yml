name: Restore69 pin final views

on:
  push:
    paths:
      - '.github/workflows/restore64-pin-index.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin restore69 directly in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          V='38-69-r1'
          files=[
            ('jr-v38-fix54.js','script','jr54-direct'),
            ('jr-v38-restore64-exact.css','link','jr64-direct'),
            ('jr-v38-restore64-exact.js','script','jr64-direct'),
            ('jr-v38-restore65-partidos.css','link','jr65-direct'),
            ('jr-v38-restore65-partidos.js','script','jr65-direct'),
            ('jr-v38-restore66-polish.css','link','jr66-direct'),
            ('jr-v38-restore66-polish.js','script','jr66-direct'),
            ('jr-v38-restore67-regenerate.css','link','jr67-direct'),
            ('jr-v38-restore67-regenerate.js','script','jr67-direct'),
            ('jr-v38-restore68-table-motion.css','link','jr68-direct'),
            ('jr-v38-restore68-table-motion.js','script','jr68-direct'),
          ]
          for fn,kind,key in files:
            if kind=='link':
              tag=f'<link rel="stylesheet" href="./assets/{fn}?v={V}" data-{key}="1">'
              pat=rf'<link[^>]+{re.escape(fn)}\?v=[^"\']+[^>]*>'
              if fn in s:s=re.sub(pat,tag,s)
              else:s=s.replace('</head>',tag+'\n</head>',1)
            else:
              tag=f'<script defer src="./assets/{fn}?v={V}" data-{key}="1"></script>'
              pat=rf'<script[^>]+{re.escape(fn)}\?v=[^"\']+[^>]*></script>'
              if fn in s:s=re.sub(pat,tag,s)
              else:s=s.replace('</body>',tag+'\n</body>',1)
          css69=f'<link rel="stylesheet" href="./assets/jr-v38-restore69-final.css?v={V}" data-jr69-direct="1">'
          js69=f'<script defer src="./assets/jr-v38-restore69-final.js?v={V}" data-jr69-direct="1"></script>'
          if 'jr-v38-restore69-final.css' not in s:s=s.replace('</head>',css69+'\n</head>',1)
          else:s=re.sub(r'<link[^>]+jr-v38-restore69-final\.css\?v=[^"\']+[^>]*>',css69,s)
          if 'jr-v38-restore69-final.js' not in s:s=s.replace('</body>',js69+'\n</body>',1)
          else:s=re.sub(r'<script[^>]+jr-v38-restore69-final\.js\?v=[^"\']+[^>]*></script>',js69,s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index pin
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index already pinned'
            exit 0
          fi
          git config user.name 'Liga JR Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'restore69: pin final table stats and moving hero'
          git push origin HEAD:main
