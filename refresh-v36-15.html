<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Liga JR · Recarga V36.15</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100b;color:#fff;font-family:system-ui}
main{text-align:center;padding:28px;max-width:560px}
.ball{font-size:60px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(960deg)}}
p{color:#9fb4a8;line-height:1.6}
</style>
</head>
<body>
<main><div class="ball">⚽</div><h1>RECARGA V36.15</h1><p>Limpiando caché y cargando la versión publicada más reciente.</p></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>{})));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.setItem('jrLastRefresh','36.15');}catch(e){}
  }catch(e){}
  setTimeout(()=>location.replace('./?v=36-15-'+Date.now()),1000);
})();
</script>
</body>
</html>
