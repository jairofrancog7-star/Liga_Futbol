<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>MASTER V32.1</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090d;color:#fff;font-family:system-ui}
main{text-align:center;max-width:620px;padding:28px}.r{width:56px;height:56px;margin:auto;border:4px solid #252933;border-top-color:#18e07b;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}p{color:#9aa3af}
</style>
</head>
<body>
<main><div class="r"></div><h1>MASTER V32.1</h1><p>Limpiando caché y cargando logos verificados.</p></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>location.replace('./?v=32-1-'+Date.now()),800);
})();
</script>
</body>
</html>
