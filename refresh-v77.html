<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#06110c"><title>Actualizando Liga JR V38.77</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06110c;color:#f4fff8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}main{width:min(92vw,480px);padding:26px;border:1px solid rgba(64,233,154,.3);border-radius:22px;background:#0c1c14;box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}b{display:block;font-size:22px;margin-bottom:8px}p{margin:0;color:#9bc5aa;line-height:1.5}.spin{width:42px;height:42px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.12);border-top-color:#40e99a;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:14px;color:#678b74}</style></head><body><main><div class="spin"></div><b>Actualizando Liga Juventino Rosas</b><p>Reacomodando categorías y habilitando desplazamiento horizontal completo en Partidos y Tabla.</p><small>V38.77</small></main><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}try{localStorage.setItem('jr-last-refresh','38-77')}catch(e){}setTimeout(()=>location.replace('./?refresh=38-77&ts='+Date.now()),900)})();</script></body></html>
