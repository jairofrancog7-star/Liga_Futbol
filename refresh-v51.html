<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Actualizando Liga JR · FIX51</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #020907; color: #f3fff9; }
    main { width: min(92vw, 520px); padding: 34px 28px; border: 1px solid #08724f; border-radius: 18px; background: #071510; text-align: center; box-shadow: 0 18px 70px #0008; }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0 0 18px; color: #b7d7c8; }
    #status { color: #51e6a4; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Aplicando FIX51</h1>
    <p>Limpiando caché para mostrar el escudo de América.</p>
    <div id="status">Limpiando…</div>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister().catch(() => {})));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        try { sessionStorage.removeItem('jr57-refresh-attempt'); } catch (_) {}
        try { sessionStorage.removeItem('jr-v17-reloaded'); } catch (_) {}
      } catch (_) {}
      status.textContent = 'Abriendo tarjeta de América…';
      const target = new URL('./', location.href);
      target.searchParams.set('refresh', '38-51');
      target.searchParams.set('n', String(Date.now()));
      target.hash = 'teams';
      setTimeout(() => location.replace(target.href), 500);
    })();
  </script>
</body>
</html>
