<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Actualizando Liga JR · FIX32</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020806;color:#f4f7f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(92vw,560px);padding:30px;border:1px solid rgba(40,235,160,.25);border-radius:24px;background:#06110d;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.45)}.spin{width:54px;height:54px;margin:0 auto 18px;border:4px solid #173027;border-top-color:#20e8a1;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#9fb0a8;font-size:14px;line-height:1.5;margin:0}.ok{color:#20e8a1;font-weight:800;margin-top:14px}
</style>
</head>
<body>
<main class="box"><div class="spin"></div><h1>Aplicando FIX32</h1><p>Limpiando caché y cargando la tarjeta correcta de Primera Fuerza.</p><div class="ok" id="s">Preparando…</div></main>
<script>
(async()=>{
 const s=document.getElementById('s');
 try{
   if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
   if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
   const exact=[
    './assets/jr-v38-primera-logo.css?v=38-28',
    './assets/jr-v38-primera-logo.js?v=38-28',
    './assets/jr-v38-mobile-sync.js?v=38-28',
    './build-v38.json',
    './manifest.webmanifest'
   ];
   s.textContent='Recargando archivos visuales…';
   await Promise.all(exact.map(u=>fetch(u+(u.includes('?')?'&':'?')+'fix32='+Date.now(),{cache:'reload',credentials:'omit'}).catch(()=>null)));
 }catch(e){}
 s.textContent='Listo. Abriendo Equipos…';
 const u=new URL('./',location.href);u.searchParams.set('refresh','38-32');u.searchParams.set('n',Date.now());u.hash='teams';
 setTimeout(()=>location.replace(u.href),650);
})();
</script>
</body>
</html>
