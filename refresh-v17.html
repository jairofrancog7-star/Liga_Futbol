<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Actualizando Liga Juventino Rosas</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;color:#f2f2f5;font-family:system-ui,sans-serif}
main{max-width:560px;padding:28px;text-align:center}
.loader{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;border:4px solid #202027;border-top-color:#22e07a;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
small{color:#8b8b98}
</style>
</head>
<body>
<main>
<div class="loader"></div>
<h1>Actualizando Liga Juventino Rosas</h1>
<p>Limpiando la versión antigua guardada en tu navegador...</p>
<small>MASTER V17</small>
</main>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
  } catch (e) {
    console.warn(e);
  }

  // Bypass the old cached URL completely.
  const target = './?v=17-' + Date.now();
  setTimeout(() => location.replace(target), 700);
})();
</script>
</body>
</html>
