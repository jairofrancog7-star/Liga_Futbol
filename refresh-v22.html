<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Actualizando Liga JR V22</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050608;color:#f5f5f7;font:16px system-ui}main{max-width:650px;text-align:center;padding:30px}.r{width:54px;height:54px;margin:auto;border:4px solid #25262d;border-top-color:#22e07a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#9093a1}</style>
</head><body><main><div class="r"></div><h1>MASTER V22</h1><p>Limpiando caché y activando video completo, multimedia, PWA, accesos, reglamento y JR Control.</p></main>
<script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}setTimeout(()=>location.replace('./?v=22-'+Date.now()),900)})();</script>
</body></html>
