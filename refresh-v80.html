<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Actualizando Liga Juventino Rosas V38.80</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07100b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{max-width:420px;padding:28px;text-align:center}.ball{font-size:42px}.box b{display:block;font-size:22px;margin:10px 0}.box p{opacity:.75;line-height:1.45}
</style>
</head>
<body>
<div class="box"><div class="ball">⚽</div><b>Aplicando corrección V38.80</b><p id="status">Limpiando caché y cargando los botones corregidos…</p></div>
<script>
(async()=>{
 const s=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
  try{localStorage.setItem('jrBuild','38-80-1')}catch(_){}
  s.textContent='Listo. Abriendo la versión corregida…';
 }catch(_){s.textContent='Abriendo la versión corregida…'}
 const n=Date.now();
 setTimeout(()=>location.replace('./?refresh=38-80-1&n='+n+'#home'),250);
})();
</script>
</body>
</html>
